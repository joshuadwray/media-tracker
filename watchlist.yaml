streaming:
  # TMDB provider names (case-insensitive). Rent/buy always notified.
  services: [Netflix, Hulu, HBO Max, Apple TV Plus, Disney Plus, Amazon Prime Video]

sources:
  # loan_days turns a hold queue into a wait, and distance_mi ranks physical
  # copies against each other (digital is 0 — it comes to you). Beyond
  # availability.MAX_DISTANCE_MI a physical copy is still reported but never
  # headlines a book, so a shelf copy 200 miles away can't mark it "got it".

  denton-library:
    kind: bibliocommons
    library: denton              # https://denton.bibliocommons.com
    label: Denton
    # EBOOK/AUDIOBOOK excluded — Denton's digital side is cloudLibrary,
    # which we watch separately, so those would be duplicate notifs.
    # AB = audiobook on CD (physical), which cloudLibrary doesn't cover.
    formats: [BK, AB]
    loan_days: 21
    distance_mi: 3               # the one physical collection we watch

  cloudlibrary:
    kind: cloudlibrary
    # Your cloudLibrary id is in the URL you use to log in:
    # https://ebook.yourcloudlibrary.com/library/<THIS PART>/...
    # Case-sensitive! Wrong case redirects to the marketing site.
    library: Denton
    label: Denton
    loan_days: 21             # cloudLibrary standard loan

  cloudlibrary-lewisville:
    kind: cloudlibrary
    # Lewisville Public Library — id verified 2026-08 (lowercase here, unlike
    # Denton's; the id is whatever segment your login URL uses).
    # Lewisville has no Libby/OverDrive: cloudLibrary is its only digital
    # vendor. Print is watched separately by lewisville-print, below.
    library: lewisvillepubliclibrary
    label: Lewisville            # display name for pushes/report
    loan_days: 21                # published: library.cityoflewisville.com FAQ

  lewisville-print:
    kind: sirsi-enterprise
    # Lewisville Public Library, SirsiDynix Enterprise 5.1406. Enterprise
    # hostnames follow no pattern — this one came from the library's
    # BLUEcloud Mobile app id (sirsi.mobile.bcmobile_lewisville). Note the
    # city's own library.cityoflewisville.com is behind Akamai and 403s
    # datacenter IPs; this catalog host does not.
    host: lewp.ent.sirsi.net
    profile: default
    label: Lewisville
    # Books only. The digital side is cloudlibrary-lewisville, and the
    # source already drops Enterprise's federated ERC_ records (cloudLibrary
    # + Freegal) so the two can't double-notify. Large-print editions report
    # "Books" too and are split out by title marker.
    formats: [Books]
    loan_days: 21                # same as Lewisville cloudLibrary
    distance_mi: 20              # Denton -> Lewisville
    # Lucky Day: extra copies of high-demand titles that CANNOT be held, so
    # they cycle first-come, first-served. Flagged on the dashboard because
    # it changes the approach — a copy here is a way past a long queue.
    # `facet` is four tab-separated fields (index, its display name,
    # 1:<code>, the value's display name) and BOTH display names are part of
    # the key, so a rename at the library end silently empties the shelf;
    # `tracker probe lewisville-print` prints the record count to catch that.
    # `status` is what Enterprise reports for a copy sitting on the shelf —
    # item status doubles as location for anything in the building.
    shelves:
      - label: Lucky Day
        facet: "LOCATION\tShelf Location\t1:LUCKYDAY\tLucky Day Display"
        status: Lucky Day Display

  libby-fortworth:
    kind: libby
    # Fort Worth Public Library. Key is the segment in
    # https://libbyapp.com/library/<key>. Fort Worth has no cloudLibrary —
    # Libby is its digital collection. Print is Polaris, not watched (TODO.md).
    library: fwpl
    label: Fort Worth
    # Not published; patrons pick 7/14/21 in Libby where offered. 14 is
    # OverDrive's default and what its own wait arithmetic assumes.
    loan_days: 14

  libby-houston:
    kind: libby
    # Houston Public Library. Free "MY Link" card for any Texas resident
    # (houstonlibrary.org/mylink), so this collection costs nothing but a
    # signup. Key verified 2026-08: status "Live", isConsortium false.
    # Two near-miss keys to avoid — `houston` is the Houston Area Digital
    # Media Catalog (a consortium that holds almost nothing we watch) and
    # `hpl` is Hamilton Public Library in Ontario.
    # Print is SirsiDynix Enterprise, not watched (TODO.md).
    library: houstonlibrary
    label: Houston               # display name for pushes/report
    loan_days: 14                # published: houstonlibrary.org/download-stream

  texas-theatre:
    kind: pages
    pages:
      - name: Texas Theatre
        url: https://thetexastheatre.com/

  # Angelika Dallas: parked. The site is a client-rendered React app (page
  # text is just "Movie Information | Tickets | Showtimes") and its backend
  # (production-api.readingcinemas.com) requires a bearer token behind a
  # reCAPTCHA flow — no clean, polite way to watch it as of 2026-07.
  # angelika:
  #   kind: pages
  #   pages:
  #     - name: Angelika Dallas
  #       url: https://angelikafilmcenter.com/dallas

  cinemark:
    kind: cinemark
    theatres:
      # Verify each URL by loading it in a browser, then run:
      #   python -m tracker probe --source cinemark
      - name: Cinemark Denton 14
        url: https://www.cinemark.com/theatres/tx-denton/cinemark-denton-14
      - name: Cinemark West Plano
        url: https://www.cinemark.com/theatres/tx-plano/cinemark-west-plano-and-xd
      - name: Cinemark Dallas IMAX
        url: https://www.cinemark.com/theatres/tx-dallas/cinemark-dallas-xd-and-imax

  amc:
    kind: amc
    theatres:
      - name: AMC Stonebriar 24
        url: https://www.amctheatres.com/movie-theatres/dallas-ft-worth/amc-dine-in-stonebriar-24/showtimes
      - name: AMC Grapevine Mills 30
        url: https://www.amctheatres.com/movie-theatres/dallas-ft-worth/amc-grapevine-mills-30/showtimes
      - name: AMC Northpark 15
        url: https://www.amctheatres.com/movie-theatres/dallas-ft-worth/amc-northpark-15/showtimes

  # Alamo has the cleanest showtime feed in the metro (one JSON request
  # covers every DFW location) — flip enabled to true to include it.
  alamo:
    kind: drafthouse
    market: dfw
    enabled: false

state_file: state/state.json
